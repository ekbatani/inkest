services:
  app:
    # A fresh source checkout is deployable before a public registry exists.
    # After the Docker Hub release gate is completed, operators may set
    # INKEST_IMAGE=docker.io/<namespace>/inkest:<version> to use that image.
    image: ${INKEST_IMAGE:-inkest:local}
    build:
      context: .
    expose:
      - "3000"
    environment:
      DATABASE_URL: file:/app/data/local.db
      INKEST_DEPLOYMENT_ENV: ${INKEST_DEPLOYMENT_ENV:-self-hosted}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET to a unique random value before starting Inkest}
      AI_CREDENTIAL_ENCRYPTION_KEYS: ${AI_CREDENTIAL_ENCRYPTION_KEYS:-}
      ATTACHMENT_STORAGE_DRIVER: ${ATTACHMENT_STORAGE_DRIVER:-local}
      LOCAL_STORAGE_ROOT: ${LOCAL_STORAGE_ROOT:-/app/storage}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-}
      MINIO_BUCKET: ${MINIO_BUCKET:-}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
      AI_PROVIDER: openrouter
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL:
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      BILLING_PROVIDER: ${BILLING_PROVIDER:-}
      CRYPTOMUS_MERCHANT_ID: ${CRYPTOMUS_MERCHANT_ID:-}
      CRYPTOMUS_API_KEY: ${CRYPTOMUS_API_KEY:-}
      BILLING_PAYMENT_ASSET: ${BILLING_PAYMENT_ASSET:-USDT}
      BILLING_PAYMENT_NETWORK: ${BILLING_PAYMENT_NETWORK:-tron}
      BILLING_MANUAL_WALLET_ADDRESS: ${BILLING_MANUAL_WALLET_ADDRESS:-}
      BILLING_MANUAL_WALLET_NETWORK: ${BILLING_MANUAL_WALLET_NETWORK:-tron}
      BILLING_MANUAL_WALLET_ASSET: ${BILLING_MANUAL_WALLET_ASSET:-USDT}
      BILLING_CREDITS_PER_USD: ${BILLING_CREDITS_PER_USD:-100}
      BILLING_MIN_TOPUP_USD: ${BILLING_MIN_TOPUP_USD:-5}
      BILLING_MAX_TOPUP_USD: ${BILLING_MAX_TOPUP_USD:-500}
      BILLING_INVOICE_LIFETIME_MINUTES: ${BILLING_INVOICE_LIFETIME_MINUTES:-60}
    volumes:
      - inkest-data:/app/data
      - inkest-storage:/app/storage
    restart: unless-stopped
  minio:
    image: minio/minio:RELEASE.2026-06-13T11-33-47Z
    profiles:
      - storage
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER before enabling the storage profile}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD before enabling the storage profile}
    command: server /data --console-address ":9001"
    expose:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - inkest-minio:/data
    restart: unless-stopped

volumes:
  inkest-data:
  inkest-storage:
  inkest-minio:

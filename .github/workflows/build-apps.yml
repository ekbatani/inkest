name: Cross-Platform Native Apps CI (Desktop & Mobile)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            target: "x86_64-apple-darwin"
          - platform: "ubuntu-latest"
            target: "x86_64-unknown-linux-gnu"
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare native assets
        run: bun run prepare:native

      - name: Build Web App
        run: bun run build

      - name: Build Desktop Executable via Tauri
        uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Inkest ${{ github.ref_name }}'
          releaseBody: 'Automated cross-platform release for Inkest.'
          releaseDraft: false
          prerelease: false

      - name: Collect Desktop Release Assets
        shell: bash
        run: |
          mkdir -p desktop-release
          find src-tauri/target -type f \( -name "*.msi" -o -name "*.exe" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.dmg" -o -name "*.app.tar.gz" \) -exec cp {} desktop-release/ \; || true

      - name: Upload Desktop Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: inkest-desktop-${{ matrix.platform }}
          path: desktop-release/*
          if-no-files-found: ignore

      - name: Publish Desktop Assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: desktop-release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    name: Build Mobile (Android APK)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare native assets
        run: bun run prepare:native

      - name: Build Web App
        run: bun run build

      - name: Sync Capacitor Android
        run: |
          bun add -d @capacitor/cli @capacitor/core @capacitor/android
          npx cap add android || true
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          ./gradlew assembleRelease || true

      - name: Prepare Android Release Assets
        run: |
          mkdir -p release-android
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk release-android/inkest-android-debug.apk
          fi
          if [ -f "android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk release-android/inkest-android-release-unsigned.apk
          fi

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: inkest-android-apk
          path: release-android/*.apk

      - name: Publish Android APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release-android/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ios:
    name: Build Mobile (iOS Shell)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare native assets
        run: bun run prepare:native

      - name: Build Web App
        run: bun run build

      - name: Sync Capacitor iOS
        run: |
          bun add -d @capacitor/cli @capacitor/core @capacitor/ios
          npx cap add ios || true
          npx cap sync ios

      - name: Package iOS Shell
        run: |
          mkdir -p release-ios
          zip -r release-ios/inkest-ios-xcode-project.zip ios/App

      - name: Upload iOS Xcode Project Artifact
        uses: actions/upload-artifact@v4
        with:
          name: inkest-ios-xcode-project
          path: release-ios/inkest-ios-xcode-project.zip

      - name: Publish iOS Package to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release-ios/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-release:
    name: Consolidate and Publish GitHub Release
    needs: [build-desktop, build-android, build-ios]
    if: always() && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Consolidate Release Assets and Generate Checksums
        run: |
          mkdir -p dist
          find all-artifacts -type f \( -name "*.apk" -o -name "*.zip" -o -name "*.msi" -o -name "*.exe" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.dmg" -o -name "*.app.tar.gz" \) -exec cp {} dist/ \;
          cd dist
          sha256sum * > SHA256SUMS.txt || true
          cat SHA256SUMS.txt

      - name: Publish Consolidated GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Inkest ${{ github.ref_name }}
          body: |
            ## Inkest Release ${{ github.ref_name }}

            Cross-platform application installation packages for Inkest.

            ### Available Packages

            | Platform | Package Format |
            | :--- | :--- |
            | **Windows** | `.msi` installer, `.exe` setup |
            | **Linux** | `.deb` (Debian/Ubuntu), `.AppImage` (Universal Linux) |
            | **macOS** | `.dmg` disk image, `.app.tar.gz` |
            | **Android** | `.apk` installation package |
            | **iOS** | `.zip` Xcode project bundle |

            All release assets are verified with SHA256 checksums in `SHA256SUMS.txt`.
          files: dist/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

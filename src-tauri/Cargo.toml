[package]
name = "inkest"
version = "0.1.0"
description = "Inkest Desktop — Markdown Workspace"
authors = ["Inkest Maintainers"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "inkest_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
